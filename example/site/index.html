  <h1>A calmer inbox</h1>
  <p>Example <b>sorts new mail into two piles</b>: the mail that needs you, and
     the mail that is handled. Get one wrong? Correct it once and it stays
     corrected for that sender.</p>
  <p>Your mail is never used to train a model, ours or anyone else&rsquo;s.</p>
